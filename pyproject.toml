[project]
name = "firedrake-ts"
version = "0.3.0"
description = "PETSc TS interface for Firedrake: scalable solution of DAEs arising from time-dependent PDEs"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
    { name = "Ivan Yashchuk" },
    { name = "Vojta Molda", email = "vojta@atomic.industries" },
    { name = "Jared Callaham", email = "jared@atomic.industries" },
]
maintainers = [
    { name = "Vojta Molda", email = "vojta@atomic.industries" },
    { name = "Jared Callaham", email = "jared@atomic.industries" },
]
keywords = [ "firedrake", "petsc", "ts", "dae", "finite elements", "simulation" ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]
urls = { homepage = "https://github.com/Atomic-Industries/firedrake-ts" }
requires-python = ">=3.12"

# Firedrake is deliberately NOT declared as a dependency. It is supplied by the
# environment -- the firedrakeproject/firedrake-vanilla-default image in CI and
# in downstream containers. Declaring it would make every downstream `uv sync`
# (sundrake pulls this package in from a git ref) try to resolve and build
# Firedrake and PETSc from source. See the README for what the environment must
# provide.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15.11,<1",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "firedrake_ts" ]

[[tool.uv.index]]
name = "atomic"
url = "https://pypi.atmc.dev/"
publish-url = "https://pypi.atmc.dev/"
explicit = true

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.coverage.run]
branch = true
source = [ "firedrake_ts" ]

[tool.coverage.report]
ignore_errors = true
omit = [
    "examples/*",
    "tests/*",
]

[tool.coverage.html]
directory = "coverage_html"
